<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MQTT JSON Sender</title>

    <!-- Eclipse Paho MQTT JavaScript library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.js" type="text/javascript"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 14px;
            padding: 10px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            cursor: pointer;
        }

        #status {
            margin-top: 20px;
            padding: 10px;
            background: #eee;
        }
		
		#messages { margin-top: 10px; width: 100%; height: 250px; box-sizing: border-box; border: 2px solid #777; border-radius: 5px; background: #f8f8f8; padding: 10px; overflow-y: auto; font-family: monospace; font-size: 13px; white-space: pre-wrap; }
    </style>
</head>

<body>

    <h1>MQTT JSON Sender</h1>

    <textarea id="jsonMessage">{"recipient" : "DeviceIoTLock", "cmd" : "B", "replyTo" : "iotSafeLock/data", "arg1" : "1750"}</textarea>
	Note: cmd: L activer le latch, B:buzzer, T:temperature, R:door status, W:WS2812B

    <button onclick="connectMQTT()">Connect</button>

    <button onclick="sendMessage()">Send JSON</button>
	
	<button onclick="clearMessages()">Clear Messages</button>

    <div id="status">
        Disconnected
    </div>
	
	<h3>Received MQTT Messages</h3>

    <div id="messages"></div>


    <script>

        // =====================================================
        // MQTT CONFIGURATION
        // =====================================================

        const MQTT_HOST = "technophyscal.cloud.shiftr.io";
        const MQTT_USERNAME = "technophyscal";
        const MQTT_PASSWORD = "JBxhG3WAyeNT3BZk";   //Enseignant03
        const MQTT_TOPIC = "iotSafeLock/prof";
        const MQTT_PORT = 443;
        const MQTT_PATH = '/';

        const MQTT_SUBSCRIBE_TOPIC = "iotSafeLock/data";

		const MAX_MESSAGES = 15;
		let receivedMessages = [];

        // =====================================================
        // MQTT CLIENT
        // =====================================================

        let mqttClient = null;


        // =====================================================
        // CONNECT TO MQTT BROKER
        // =====================================================

        function connectMQTT() {

            document.getElementById("status").innerText =
                "Connecting...";


            // Create a unique client ID

            const clientId =
                "webclient_" +
                Math.random()
                    .toString(16)
                    .substring(2);


            mqttClient = new Paho.MQTT.Client(
                MQTT_HOST,
                Number(MQTT_PORT),
                MQTT_PATH,
                clientId
            );


            // Connection lost callback

            mqttClient.onConnectionLost = function (responseObject) {

                console.log(
                    "Connection lost:",
                    responseObject.errorMessage
                );

                document.getElementById("status").innerText =
                    "Disconnected";
            };


            // Message received callback
            // Not required for sending, but useful later.

            mqttClient.onMessageArrived =
                function (message) {

                   // console.log(
                   //     "Message received:",
                   //     message.destinationName,
                   //     message.payloadString
                   // );


                    // Add message to scrolling box

                    const messages =
                        document.getElementById("messages");


                    const timestamp =
                        new Date().toLocaleTimeString();


                    const messageEntry =
                        "[" + timestamp + "] " +
                        message.destinationName +
                        "\n" +
                        message.payloadString;

					receivedMessages.push(messageEntry);

                    while ( receivedMessages.length > MAX_MESSAGES ) 
					{ // Remove oldest message
						receivedMessages.shift();
					} 
					updateMessageDisplay();

                };


            // Connection options

            const options = {

                useSSL: true,
				mqttVersion: 3,
                userName: MQTT_USERNAME,
                password: MQTT_PASSWORD,
                onSuccess: function () {

                    document.getElementById("status").innerText =
                        "Connected to MQTT broker";

                    console.log("MQTT connected");
					
					mqttClient.subscribe(
                        MQTT_SUBSCRIBE_TOPIC,
                        {

                            qos: 0,

                            onSuccess: function () {

                                console.log(
                                    "Subscribed to:",
                                    MQTT_SUBSCRIBE_TOPIC
                                );


                                document.getElementById("status").innerText =
                                    "Connected - subscribed to " +
                                    MQTT_SUBSCRIBE_TOPIC;

                            },

                            onFailure: function (error) {

                                console.error(
                                    "Subscription failed:",
                                    error
                                );

                            }

                        }
					);

                },

                onFailure: function (error) {

                    console.error(
                        "MQTT connection failed:",
                        error.errorMessage
                    );

                    document.getElementById("status").innerText =
                        "Connection failed: " +
                        error.errorMessage;
                }
            };


            mqttClient.connect(options);

        }
		
		function updateMessageDisplay() {
			const messages = document.getElementById("messages");
			messages.innerText = receivedMessages.join("\n\n");
			// Automatically scroll to bottom 
			messages.scrollTop = messages.scrollHeight;
		}


        // =====================================================
        // SEND JSON MESSAGE
        // =====================================================

        function sendMessage() {

            if (!mqttClient ||
                !mqttClient.isConnected()) {

                alert("Not connected to MQTT broker.");

                return;
            }


            const jsonText =
                document.getElementById("jsonMessage").value;


            // Verify that the message is valid JSON

            try {

                JSON.parse(jsonText);

            }
            catch (error) {

                alert("Invalid JSON message.");

                return;
            }


            // Create MQTT message

            const message =
                new Paho.MQTT.Message(jsonText);


            message.destinationName =
                MQTT_TOPIC;


            // Publish message

            mqttClient.send(message);


            document.getElementById("status").innerText =
                "JSON message sent";


            console.log(
                "Topic:",
                MQTT_TOPIC
            );

            console.log(
                "Message:",
                jsonText
            );

        }
		
		function clearMessages() {
            receivedMessages = [];
            updateMessageDisplay();
        }

    </script>

</body>

</html>
